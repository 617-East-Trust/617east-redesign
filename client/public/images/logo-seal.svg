<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8c45a"/>
      <stop offset="50%" stop-color="#d4a84a"/>
      <stop offset="100%" stop-color="#c49a3e"/>
    </linearGradient>
    <linearGradient id="goldGrad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0d070"/>
      <stop offset="100%" stop-color="#b89230"/>
    </linearGradient>
  </defs>

  <!-- Outer ring -->
  <circle cx="200" cy="200" r="185" fill="none" stroke="url(#goldGrad2)" stroke-width="3"/>

  <!-- Dotted inner ring -->
  <circle cx="200" cy="200" r="170" fill="none" stroke="url(#goldGrad2)" stroke-width="1" stroke-dasharray="3,4"/>

  <!-- Upper arch text: 617 EAST -->
  <path id="upperArc" d="M 95 170 A 120 120 0 0 1 305 170" fill="none"/>
  <text font-family="'Georgia','Times New Roman',serif" font-size="26" font-weight="bold" fill="url(#goldGrad2)" letter-spacing="8">
    <textPath href="#upperArc" startOffset="50%" text-anchor="middle">617 EAST</textPath>
  </text>

  <!-- Lower arch text: TRUST -->
  <path id="lowerArc" d="M 95 240 A 120 120 0 0 0 305 240" fill="none"/>
  <text font-family="'Georgia','Times New Roman',serif" font-size="26" font-weight="bold" fill="url(#goldGrad2)" letter-spacing="8">
    <textPath href="#lowerArc" startOffset="50%" text-anchor="middle">TRUST</textPath>
  </text>

  <!-- Skyline silhouettes -->
  <g fill="url(#goldGrad2)" opacity="0.7">
    <!-- Main building -->
    <rect x="135" y="165" width="28" height="65" rx="1"/>
    <rect x="145" y="155" width="8" height="10"/>
    <!-- Tall building -->
    <rect x="168" y="148" width="18" height="82" rx="1"/>
    <rect x="172" y="140" width="10" height="8"/>
    <line x1="168" y1="230" x2="186" y2="230" stroke="url(#goldGrad2)" stroke-width="0.5"/>
    <line x1="168" y1="220" x2="186" y2="220" stroke="url(#goldGrad2)" stroke-width="0.5"/>
    <line x1="168" y1="210" x2="186" y2="210" stroke="url(#goldGrad2)" stroke-width="0.5"/>
    <line x1="168" y1="200" x2="186" y2="200" stroke="url(#goldGrad2)" stroke-width="0.5"/>
    <line x1="168" y1="190" x2="186" y2="190" stroke="url(#goldGrad2)" stroke-width="0.5"/>
    <line x1="168" y1="180" x2="186" y2="180" stroke="url(#goldGrad2)" stroke-width="0.5"/>
    <line x1="168" y1="170" x2="186" y2="170" stroke="url(#goldGrad2)" stroke-width="0.5"/>
    <line x1="168" y1="160" x2="186" y2="160" stroke="url(#goldGrad2)" stroke-width="0.5"/>
    <!-- Mid building -->
    <rect x="190" y="170" width="22" height="60" rx="1"/>
    <!-- Stepped building -->
    <rect x="217" y="178" width="18" height="52" rx="1"/>
    <rect x="217" y="168" width="18" height="10"/>
    <!-- Small building -->
    <rect x="240" y="195" width="20" height="35" rx="1"/>
  </g>

  <!-- Roots from bottom transforming into pinecone base -->
  <g stroke="url(#goldGrad2)" stroke-width="2" fill="none" opacity="0.6">
    <path d="M 145 230 Q 160 260 180 280 Q 185 288 190 290"/>
    <path d="M 255 230 Q 240 260 220 280 Q 215 288 210 290"/>
    <path d="M 160 240 Q 170 265 185 282"/>
    <path d="M 240 240 Q 230 265 215 282"/>
  </g>

  <!-- Pinecone shape (center, overlapping roots) -->
  <g fill="none" stroke="url(#goldGrad2)" stroke-width="1.8">
    <ellipse cx="200" cy="260" rx="22" ry="35" opacity="0.35"/>
    <!-- Pinecone scales -->
    <path d="M 182 238 Q 200 228 218 238" opacity="0.8"/>
    <path d="M 180 248 Q 200 238 220 248" opacity="0.8"/>
    <path d="M 181 258 Q 200 248 219 258" opacity="0.8"/>
    <path d="M 184 268 Q 200 258 216 268" opacity="0.7"/>
    <path d="M 188 278 Q 200 270 212 278" opacity="0.6"/>
    <path d="M 190 286 Q 200 282 210 286" opacity="0.3"/>
  </g>

  <!-- Pine needles flanking -->
  <g stroke="url(#goldGrad2)" stroke-width="1.2" fill="none" opacity="0.5">
    <path d="M 140 210 Q 110 200 95 230"/>
    <path d="M 135 220 Q 105 215 100 245"/>
    <path d="M 260 210 Q 290 200 305 230"/>
    <path d="M 265 220 Q 295 215 300 245"/>
  </g>

  <!-- Central compass star accent -->
  <path d="M 200 175 L 204 193 L 220 198 L 204 203 L 200 220 L 196 203 L 180 198 L 196 193 Z" fill="url(#goldGrad)" opacity="0.5"/>
</svg>