services:
  app:
    build: .
    container_name: 617east-web
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      # Explicit Wave 4 keys (also loaded via env_file when present)
      - ANALYTICS_ENDPOINT
      - ANALYTICS_WEBSITE_ID
      - N8N_WEBHOOK_URL
      - GA4_ID
      - CLARITY_ID
      - GTM_ID
      - CALLRAIL_SWAP_ID
      - CONSENT_RECORDER_URL
      # First-party analytics pipeline (server-side proxy; token never in HTML)
      - ANALYTICS_COLLECT_URL
      - ANALYTICS_COLLECT_TOKEN
    restart: unless-stopped
