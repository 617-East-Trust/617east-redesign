services:
  app:
    build: .
    container_name: 617east-web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - ANALYTICS_ENDPOINT
      - ANALYTICS_WEBSITE_ID
      - N8N_WEBHOOK_URL
      # Wave 4 measurement (consent-gated client load)
      - GA4_ID
      - CLARITY_ID
      - GTM_ID
      - CALLRAIL_SWAP_ID
      - CONSENT_RECORDER_URL
    restart: unless-stopped
